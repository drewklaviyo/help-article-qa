name: Help Article QA

on:
  schedule:
    - cron: '0 7 * * *'  # 2am EST = 7am UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'articles.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Decrypt saved session
        env:
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          if [ -f playwright-state.json.enc ] && [ -n "$SESSION_PASSPHRASE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -d -in playwright-state.json.enc -out playwright-state.json -pass "pass:$SESSION_PASSPHRASE"
            echo "Session decrypted successfully"
          else
            echo "No encrypted session found, will attempt fresh login"
          fi

      - name: Restore dashboard history
        uses: actions/cache@v4
        with:
          path: dashboard/data/history.json
          key: qa-history-${{ github.run_number }}
          restore-keys: qa-history-

      - name: Run QA
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KLAVIYO_TEST_EMAIL: ${{ secrets.KLAVIYO_TEST_EMAIL }}
          KLAVIYO_TEST_PASSWORD: ${{ secrets.KLAVIYO_TEST_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx ts-node scripts/qa-runner.ts --limit=30
        continue-on-error: true

      - name: Verify dashboard data
        if: always()
        run: |
          echo "Dashboard data directory contents:"
          ls -la dashboard/data/ 2>/dev/null || echo "No data directory"
          if [ -f dashboard/data/latest.json ]; then
            echo "latest.json exists ($(wc -c < dashboard/data/latest.json) bytes)"
          else
            echo "WARNING: latest.json not found"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: screenshots/
          retention-days: 7

      - name: Deploy dashboard to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-dashboard:
    needs: qa
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
